# Fuehrt die Testsuite bei jedem Push und PR aus.
#
# Bis 2026-08-18 hatte dieses Repo gar keine CI — 238 Tests liefen nur, wenn
# jemand sie von Hand startete.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Das Repo hat kein pyproject.toml — Laufzeit-Abhaengigkeiten stehen in
      # requirements.txt, pytest ist dort nur als Kommentar vermerkt und wird
      # darum hier explizit installiert.
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8"

      - name: Tests
        run: python -m pytest tests/ -q
